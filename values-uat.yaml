# helm/springboot-app/values-uat.yaml
# ─────────────────────────────────────
#  UAT environment overrides
# ─────────────────────────────────────

replicaCount: 2
environment: uat

image:
  repository: ""
  tag: ""
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app-uat.pranshu-internal.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: uat-tls-secret
      hosts:
        - app-uat.pranshu-internal.com

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "uat"
  - name: LOG_LEVEL
    value: "INFO"
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: db-secret-uat
        key: url

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - springboot-app
          topologyKey: kubernetes.io/hostname
